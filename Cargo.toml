[package]
name = "adm"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
base64 = "0.22.1"
byte-unit = "5.2.0"
chrono = "0.4.44"
eframe = "0.34.1"
egui = "0.34.1"
egui_extras = { version = "0.34.1", features = ["all_loaders"] }
futures-util = "0.3.32"
reqwest = { version = "0.13.2", features = ["json", "query"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.51.1", features = ["full"] }
tokio-macros = { version = "2.7.0" }
tokio-tungstenite = "0.29.0"
uuid = { version = "1.23.1", features = ["v4"] }

